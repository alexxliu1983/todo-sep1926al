<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <style>
:root {
  --bg: #e3f2fd;
  --text: #0d47a1;
  --card: #fff;
  --muted: #1976d2;
  /* priority colors are the same in both themes; white text is readable on all three */
  --high: #c62828;
  --medium: #e65100;
  --low: #2e7d32;
}

:root[data-theme="dark"] {
  --bg: #0d1b2a;
  --text: #64b5f6;
  --card: #1a237e;
  --muted: #90caf9;
  color-scheme: dark;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background-color 0.3s ease, color 0.3s ease;
}

main {
  max-width: 480px;
  margin: 40px auto;
  padding: 0 16px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#add-form {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

#new-task {
  flex: 1;
  min-width: 0;
  padding: 8px;
  font-size: 1rem;
}

select {
  font-size: 1rem;
}

button {
  padding: 8px 12px;
  font-size: 1rem;
  cursor: pointer;
}

#task-list {
  list-style: none;
  padding: 0;
}

#task-list li {
  --p: var(--medium);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 8px;
  margin-top: 8px;
  background: color-mix(in srgb, var(--p) 18%, var(--card));
  border-radius: 4px;
  border-left: 10px solid var(--p);
  animation: slideIn 0.3s ease-out;
  transition: background-color 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(-10px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

#task-list li.priority-high { --p: var(--high); }
#task-list li.priority-medium { --p: var(--medium); }
#task-list li.priority-low { --p: var(--low); }

#task-list li span {
  flex: 1;
  word-break: break-word;
  transition: color 0.2s ease, text-decoration 0.2s ease;
}

#task-list li.done span {
  text-decoration: line-through;
  color: var(--muted);
}

#task-list li input[type="checkbox"] {
  cursor: pointer;
  transition: transform 0.2s ease;
  accent-color: var(--p);
}

#task-list li input[type="checkbox"]:checked {
  animation: checkPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes checkPop {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.3);
  }
  100% {
    transform: scale(1);
  }
}

/* priority dropdown styled as a solid colored pill */
#task-list li select {
  background: var(--p);
  color: #fff;
  font-size: 0.85rem;
  font-weight: bold;
  border: none;
  border-radius: 999px;
  padding: 4px 8px;
  cursor: pointer;
}

#task-list li select option {
  background: var(--card);
  color: var(--text);
}

#search {
  display: block;
  box-sizing: border-box;
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  font-size: 1rem;
}

.edit-input {
  flex: 1;
  min-width: 0;
  padding: 4px;
  font-size: 1rem;
}

#task-list li.empty {
  display: block;
  text-align: center;
  color: var(--muted);
  background: transparent;
  border-left: none;
}

#task-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
}

#filters {
  display: flex;
  gap: 4px;
}

#filters button,
#clear-done {
  padding: 4px 10px;
  font-size: 0.9rem;
}

#filters button[aria-pressed="true"] {
  font-weight: bold;
  background: var(--text);
  color: var(--bg);
}

#clear-done:disabled {
  cursor: default;
}

#undo-bar {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--text);
  color: var(--bg);
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}

#undo-bar[hidden] {
  display: none;
}

/* Due date styling */
#new-due-date {
  font-size: 1rem;
}

.task-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 0.85rem;
}

.due-date {
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.1);
  font-size: 0.8rem;
  transition: background-color 0.2s ease;
}

.due-date.overdue {
  background: color-mix(in srgb, #c62828 30%, var(--card));
  color: #c62828;
  font-weight: bold;
}

.due-date.today {
  background: color-mix(in srgb, #e65100 30%, var(--card));
  color: #e65100;
  font-weight: bold;
}

.due-date.upcoming {
  background: color-mix(in srgb, #2e7d32 30%, var(--card));
  color: #2e7d32;
}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>To-Do</h1>
      <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
    </header>
    <form id="add-form">
      <input id="new-task" type="text" placeholder="Add a task..." autocomplete="off" aria-label="New task">
      <input id="new-due-date" type="date" aria-label="Due date">
      <select id="new-priority" aria-label="Priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
      <button type="submit">Add</button>
    </form>
    <input id="search" type="search" placeholder="Search tasks..." autocomplete="off" aria-label="Search tasks">
    <ul id="task-list"></ul>
    <footer id="task-footer">
      <span id="counter"></span>
      <div id="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>
      <button id="clear-done" type="button">Clear completed</button>
    </footer>
  </main>
  <div id="undo-bar" hidden>
    <span id="undo-message"></span>
    <button id="undo-button" type="button">Undo</button>
  </div>
  <script>
const STORAGE_KEY = 'todo-tasks';
const THEME_KEY = 'todo-theme';
const PRIORITIES = ['high', 'medium', 'low'];
const UNDO_MS = 6000;

const form = document.getElementById('add-form');
const input = document.getElementById('new-task');
const dueDateInput = document.getElementById('new-due-date');
const prioritySelect = document.getElementById('new-priority');
const searchInput = document.getElementById('search');
const list = document.getElementById('task-list');
const counter = document.getElementById('counter');
const filterButtons = document.querySelectorAll('#filters button');
const clearDoneButton = document.getElementById('clear-done');
const undoBar = document.getElementById('undo-bar');
const undoMessage = document.getElementById('undo-message');
const undoButton = document.getElementById('undo-button');
const themeToggle = document.getElementById('theme-toggle');

let tasks = load();
let filter = 'all';
let query = '';
let editingId = null;
let removed = [];
let undoTimer = null;

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!Array.isArray(data)) return [];
    return data.map(t => ({
      ...t,
      priority: PRIORITIES.includes(t.priority) ? t.priority : 'medium',
      dueDate: t.dueDate || null
    }));
  } catch {
    return [];
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch {
  }
}

function getDueDateStatus(dueDate) {
  if (!dueDate) return 'none';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(dueDate);
  due.setHours(0, 0, 0, 0);
  const diffMs = due - today;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return 'overdue';
  if (diffDays === 0) return 'today';
  if (diffDays <= 7) return 'upcoming';
  return 'later';
}

function visibleTasks() {
  const q = query.trim().toLowerCase();
  return tasks
    .filter(t => filter === 'all' || (filter === 'done') === t.done)
    .filter(t => t.text.toLowerCase().includes(q))
    .sort((a, b) => {
      const aStatus = getDueDateStatus(a.dueDate);
      const bStatus = getDueDateStatus(b.dueDate);
      const dueDateOrder = { 'overdue': 0, 'today': 1, 'upcoming': 2, 'later': 3, 'none': 4 };
      const statusDiff = dueDateOrder[aStatus] - dueDateOrder[bStatus];
      if (statusDiff !== 0) return statusDiff;
      const priorityDiff = PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority);
      if (priorityDiff !== 0) return priorityDiff;
      return 0;
    });
}

function formatDueDate(dueDate) {
  if (!dueDate) return '';
  const date = new Date(dueDate);
  const options = { month: 'short', day: 'numeric' };
  return date.toLocaleDateString('en-US', options);
}

function makeDueDateBadge(task) {
  if (!task.dueDate) return null;
  const badge = document.createElement('span');
  badge.className = 'due-date';
  const status = getDueDateStatus(task.dueDate);
  badge.classList.add(status);
  badge.textContent = formatDueDate(task.dueDate);
  badge.title = status.charAt(0).toUpperCase() + status.slice(1);
  return badge;
}

function makeTextCell(task) {
  if (task.id !== editingId) {
    const text = document.createElement('span');
    text.textContent = task.text;
    text.title = 'Double-click to edit';
    text.addEventListener('dblclick', () => {
      editingId = task.id;
      render();
    });
    return text;
  }

  const edit = document.createElement('input');
  edit.type = 'text';
  edit.className = 'edit-input';
  edit.value = task.text;
  edit.setAttribute('aria-label', 'Edit task');
  let finished = false;
  const finish = commit => {
    if (finished) return;
    finished = true;
    const value = edit.value.trim();
    if (commit && value) {
      task.text = value;
      save();
    }
    editingId = null;
    render();
  };
  edit.addEventListener('keydown', e => {
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
  });
  edit.addEventListener('blur', () => finish(true));
  return edit;
}

function render() {
  list.innerHTML = '';
  const shown = visibleTasks();

  for (const task of shown) {
    const li = document.createElement('li');
    li.classList.add('priority-' + task.priority);
    if (task.done) li.classList.add('done');

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = task.done;
    checkbox.setAttribute('aria-label', 'Mark done');
    checkbox.addEventListener('change', () => {
      task.done = checkbox.checked;
      save();
      render();
    });

    const text = makeTextCell(task);
    const dueDateBadge = makeDueDateBadge(task);

    const priority = document.createElement('select');
    priority.setAttribute('aria-label', 'Priority');
    for (const p of PRIORITIES) {
      const option = document.createElement('option');
      option.value = p;
      option.textContent = p[0].toUpperCase() + p.slice(1);
      option.selected = p === task.priority;
      priority.appendChild(option);
    }
    priority.addEventListener('change', () => {
      if (PRIORITIES.includes(priority.value)) {
        task.priority = priority.value;
        save();
        render();
      }
    });

    const meta = document.createElement('div');
    meta.className = 'task-meta';
    if (dueDateBadge) meta.appendChild(dueDateBadge);
    meta.appendChild(priority);

    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.addEventListener('click', () => removeTasks([task], 'Task deleted'));

    li.append(checkbox, text, meta, del);
    list.appendChild(li);
  }

  if (shown.length === 0) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = tasks.length === 0 ? 'No tasks yet. Add one above.' : 'No matching tasks.';
    list.appendChild(empty);
  }

  const left = tasks.filter(t => !t.done).length;
  counter.textContent = left + (left === 1 ? ' task left' : ' tasks left');
  clearDoneButton.disabled = !tasks.some(t => t.done);
  for (const b of filterButtons) {
    b.setAttribute('aria-pressed', String(b.dataset.filter === filter));
  }

  const editor = list.querySelector('.edit-input');
  if (editor) {
    editor.focus();
    editor.select();
  }
}

function removeTasks(toRemove, message) {
  removed = toRemove.map(task => ({ task, index: tasks.indexOf(task) }));
  tasks = tasks.filter(t => !toRemove.includes(t));
  save();
  render();
  showUndo(message);
}

function showUndo(message) {
  undoMessage.textContent = message;
  undoBar.hidden = false;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndo, UNDO_MS);
}

function hideUndo() {
  undoBar.hidden = true;
  removed = [];
  clearTimeout(undoTimer);
}

undoButton.addEventListener('click', () => {
  for (const { task, index } of [...removed].sort((a, b) => a.index - b.index)) {
    tasks.splice(index, 0, task);
  }
  hideUndo();
  save();
  render();
});

clearDoneButton.addEventListener('click', () => {
  const done = tasks.filter(t => t.done);
  if (done.length) removeTasks(done, done.length === 1 ? '1 completed task cleared' : done.length + ' completed tasks cleared');
});

for (const b of filterButtons) {
  b.addEventListener('click', () => {
    filter = b.dataset.filter;
    render();
  });
}

searchInput.addEventListener('input', () => {
  query = searchInput.value;
  render();
});

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  tasks.push({
    id: Date.now(),
    text,
    done: false,
    priority: prioritySelect.value,
    dueDate: dueDateInput.value || null
  });
  input.value = '';
  dueDateInput.value = '';
  save();
  render();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  // Cmd/Ctrl+K to focus search
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }

  // Only handle shortcuts if not editing
  if (editingId !== null) return;

  // 1, 2, 3 to change priority of first visible task
  if (e.key === '1' || e.key === '2' || e.key === '3') {
    const priorities = ['high', 'medium', 'low'];
    const idx = parseInt(e.key) - 1;
    const shown = visibleTasks();
    if (shown.length > 0) {
      shown[0].priority = priorities[idx];
      save();
      render();
    }
    return;
  }

  // Cmd/Ctrl+Enter to add task
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    if (input === document.activeElement && input.value.trim()) {
      form.dispatchEvent(new Event('submit'));
    }
    return;
  }

  // Escape to focus task input
  if (e.key === 'Escape') {
    if (document.activeElement !== input) {
      input.focus();
    }
  }
});

// Dark mode
function loadTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) return saved;
  } catch {
  }
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
  themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
  themeToggle.setAttribute('aria-label', label);
  themeToggle.title = label;
}

themeToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try {
    localStorage.setItem(THEME_KEY, next);
  } catch {
  }
});

applyTheme(loadTheme());
render();
  </script>
</body>
</html>
